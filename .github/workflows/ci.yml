name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ app/ scripts/ tests/

  test:
    name: Tests (pytest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --tb=short --cov=src --cov-fail-under=80

  notebook-check:
    name: Validate Notebooks
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install nbformat
      - name: Check notebook format
        run: |
          python - <<'EOF'
          import nbformat, glob, sys
          errors = []
          for nb_path in glob.glob("notebooks/*.ipynb"):
              try:
                  with open(nb_path) as f:
                      nb = nbformat.read(f, as_version=4)
                  nbformat.validate(nb)
                  print(f"OK: {nb_path}")
              except Exception as e:
                  errors.append(f"FAIL {nb_path}: {e}")
          if errors:
              [print(e) for e in errors]
              sys.exit(1)
          EOF

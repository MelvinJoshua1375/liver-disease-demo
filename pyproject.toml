[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liver-disease-prediction"
version = "1.0.0"
description = "Machine learning pipeline for liver disease prediction with EDA, modelling, and deployment"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Melvin Joshua"},
]
keywords = ["machine-learning", "liver-disease", "prediction", "healthcare"]

dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "scipy>=1.13,<2",
    "joblib>=1.4,<2",
    "optuna>=3.6,<4",
    "pyyaml>=6.0,<7",
    "streamlit>=1.35,<2",
    "python-pptx>=0.6.23,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.4,<1",
    "ipykernel>=6.29,<7",
    "nbformat>=5.10,<6",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
